name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          # Pinned to 26 to match the version this site is verified against locally.
          node-version: 26
        env:
          # Project site lives at https://<user>.github.io/<repo>/ — derive the
          # base path from the repo name so asset/range-request URLs are correct.
          # For a user/root site or custom domain, set this to "/".
          BASE_PATH: /${{ github.event.repository.name }}/
          # Canonical data is read from Supabase Postgres at build time. These are
          # the public anon/publishable values (no secret); add them as repo secrets
          # under Settings → Secrets and variables → Actions.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Same public values, exposed to the browser for the /query page.
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Cloudflare Turnstile site key for the /submit form (public value).
          # If the secret is unset, submit.astro falls back to Cloudflare's test
          # key; set TURNSTILE_SITE_KEY as a repo secret to use a real widget.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
