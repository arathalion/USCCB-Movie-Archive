name = "movie-archive-api"
main = "src/index.js"
compatibility_date = "2026-08-03"

# Created with:
#   wrangler d1 create movie-archive
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "movie-archive"
database_id = "4d973dfd-4977-48e8-adb3-46dcfd809676"

# TURNSTILE_SECRET is a secret, not a var — set it with:
#   wrangler secret put TURNSTILE_SECRET
# If unset, /submit skips captcha verification (fine locally, not in production).

# Repo the admin "Publish" flow opens pull requests against. Public value.
# The matching GITHUB_TOKEN is a secret:
#   wrangler secret put GITHUB_TOKEN --name movie-archive-api
[vars]
GITHUB_REPO = "arathalion/USCCB-Movie-Archive"

[observability]
enabled = true
